<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Wireless LLM</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Área de arrastre nativa de macOS -->
  <div class="drag-region"></div>
  
  <!-- Sidebar estilo Finder / Apple Notes -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Conversaciones</span>
      <button id="btn-nueva-sesion" class="btn-icon-subtle" title="Nueva conversación">＋</button>
    </div>
    <div id="lista-sesiones"></div>
  </aside>

  <!-- Vista Principal -->
  <main id="main-view">
    <!-- Barra de Herramientas Unificada -->
    <header id="top-bar">
      <div class="toolbar-left">
        <button id="toggle-sidebar" title="Alternar barra lateral">◫</button>
        <span class="app-branding">Wireless LLM</span>
      </div>

      <!-- Selector de Modelos Estilo Apple Pill -->
      <div class="model-selector-container">
        <div class="model-pill">
          <span class="status-dot"></span>
          <select id="select-modelo" title="Cambiar modelo activo">
            <option value="">Conectando con Ollama...</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Overlay de Drag & Drop -->
    <div id="drop-overlay">
      <p>Suelta el archivo para cargarlo en el contexto</p>
    </div>
    
    <!-- Canvas del Chat -->
    <div id="chat-wrapper">
      <div id="chat"></div>
    </div>
    
    <!-- Isla Flotante de Entrada (Estilo Spotlight / Siri) -->
    <footer id="input-container">
      <div id="input-inner">
        <!-- Menú Emergente de Slash Commands y Skills -->
        <div id="slash-popup"></div>

        <div class="input-island">
          <button id="btn-archivo" title="Cargar archivo o carpeta local">＋</button>
          <div class="input-wrapper">
            <textarea id="prompt" rows="1" placeholder="Escribe un mensaje o presiona / para comandos y skills..."></textarea>
            <button id="btn-stop">Detener</button>
          </div>
        </div>
      </div>
    </footer>
  </main>

<script>
  const chat = document.getElementById('chat');
  const chatWrapper = document.getElementById('chat-wrapper');
  const input = document.getElementById('prompt');
  const btnStop = document.getElementById('btn-stop');
  const btnArchivo = document.getElementById('btn-archivo');
  const sidebar = document.getElementById('sidebar');
  const btnToggle = document.getElementById('toggle-sidebar');
  const dropOverlay = document.getElementById('drop-overlay');
  const listaSesiones = document.getElementById('lista-sesiones');
  const btnNuevaSesion = document.getElementById('btn-nueva-sesion');
  const slashPopup = document.getElementById('slash-popup');
  const selectModelo = document.getElementById('select-modelo');
  
  // Estado de Sesiones
  let sesiones = [{ id: 1, titulo: 'Chat Principal', mensajes: [] }];
  let sesionActivaId = 1;
  let currentIaMessage = null;
  let estaGenerando = false;

  // Comandos del Sistema
  const COMANDOS_SISTEMA = [
    { cmd: '/lee',        args: '<archivo|carpeta>',      desc: 'Inyecta un archivo o carpeta en el contexto', tipo: 'cmd' },
    { cmd: '/lee-repo',   args: '[pregunta]',              desc: 'Carga el árbol de código completo del proyecto', tipo: 'cmd' },
    { cmd: '/lee-carpeta',args: '<directorio>',            desc: 'Analiza recursivamente un directorio local', tipo: 'cmd' },
    { cmd: '/edita',      args: '<archivo> <instrucción>', desc: 'Modifica y sobreescribe un archivo en disco', tipo: 'cmd' },
    { cmd: '/edita-repo', args: '<instrucción>',           desc: 'Modificación autónoma multi-archivo (JSON)', tipo: 'cmd' },
  ];

  let catalogoComandos = [...COMANDOS_SISTEMA];
  let selectedIndex = -1;
  let filteredCommands = [];

  // =========================================================================
  // Inicialización de Modelos y Skills desde el Backend
  // =========================================================================

  async function inicializarModelos() {
    try {
      const data = await window.api.obtenerModelos();
      selectModelo.innerHTML = '';
      
      const modelos = data.modelos && data.modelos.length > 0 ? data.modelos : [data.modeloActual];
      modelos.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        if (m === data.modeloActual) opt.selected = true;
        selectModelo.appendChild(opt);
      });

      selectModelo.addEventListener('change', async (e) => {
        const nuevo = e.target.value;
        await window.api.cambiarModelo(nuevo);
        agregarBurbujaSistema(`⚡ Modelo cambiado a: ${nuevo}`);
      });
    } catch (err) {
      console.error("Error al conectar con modelos:", err);
    }
  }

  async function inicializarSkills() {
    try {
      const skills = await window.api.obtenerSkills();
      const skillsMapeadas = skills.map(s => ({
        cmd: `/${s.nombre}`,
        args: '<instrucción>',
        desc: s.descripcion,
        tipo: 'skill'
      }));
      catalogoComandos = [...COMANDOS_SISTEMA, ...skillsMapeadas];
    } catch (err) {
      console.error("Error al obtener skills:", err);
    }
  }

  // =========================================================================
  // Slash Commands & PopUp Flotante Estilo macOS
  // =========================================================================

  function getSlashToken(value) {
    const match = value.match(/^(\/\S*)/);
    return match ? match[1] : null;
  }

  function actualizarPopup() {
    const value = input.value;
    const token = getSlashToken(value);

    if (!token || value.includes(' ')) {
      ocultarPopup();
      return;
    }

    filteredCommands = catalogoComandos.filter(c => c.cmd.startsWith(token));

    if (filteredCommands.length === 0) {
      ocultarPopup();
      return;
    }

    if (selectedIndex >= filteredCommands.length) selectedIndex = filteredCommands.length - 1;

    renderPopup();
    slashPopup.classList.add('visible');
  }

  function renderPopup() {
    slashPopup.innerHTML = '';
    filteredCommands.forEach((c, i) => {
      const item = document.createElement('div');
      item.className = 'slash-item' + (i === selectedIndex ? ' selected' : '');
      
      const badge = c.tipo === 'skill' ? '<span class="slash-item-badge">SKILL</span>' : '';
      item.innerHTML =
        '<div class="slash-item-header">' +
          '<span class="slash-item-cmd">' + c.cmd + '</span>' + badge +
          '<span class="slash-item-args">' + c.args + '</span>' +
        '</div>' +
        '<div class="slash-item-desc">' + c.desc + '</div>';
        
      item.addEventListener('mousedown', (e) => {
        e.preventDefault();
        seleccionarComando(i);
      });
      slashPopup.appendChild(item);
    });
  }

  function ocultarPopup() {
    slashPopup.classList.remove('visible');
    slashPopup.innerHTML = '';
    selectedIndex = -1;
    filteredCommands = [];
  }

  function seleccionarComando(index) {
    if (index < 0 || index >= filteredCommands.length) return;
    input.value = filteredCommands[index].cmd + ' ';
    ocultarPopup();
    input.focus();
    ajustarAlturaTextarea();
  }

  function ajustarAlturaTextarea() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }

  // =========================================================================
  // Manejo de Sesiones
  // =========================================================================

  function actualizarSidebar() {
    listaSesiones.innerHTML = '';
    sesiones.forEach((sesion) => {
      const div = document.createElement('div');
      div.className = `sesion-btn ${sesion.id === sesionActivaId ? 'activa' : ''}`;
      div.innerText = sesion.titulo;
      div.onclick = () => cambiarSesion(sesion.id);
      listaSesiones.appendChild(div);
    });
  }

  function cambiarSesion(id) {
    if (estaGenerando) return;
    sesionActivaId = id;
    actualizarSidebar();
    chat.innerHTML = '';
    const sesionActual = sesiones.find(s => s.id === sesionActivaId);
    sesionActual.mensajes.forEach(msg => crearBurbujaDOM(msg.rol, msg.texto));
    scrollAbajo();
  }

  btnNuevaSesion.addEventListener('click', () => {
    if (estaGenerando) return;
    const nuevaId = Date.now();
    sesiones.unshift({ id: nuevaId, titulo: `Conversación ${sesiones.length + 1}`, mensajes: [] });
    cambiarSesion(nuevaId);
  });

  btnToggle.addEventListener('click', () => sidebar.classList.toggle('oculto'));

  // =========================================================================
  // Renderizado de Mensajes y Formato
  // =========================================================================

  function formatearMarkdownSimple(texto) {
    // Escapar tags HTML básicos para seguridad
    let out = texto
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    // Bloques de código con triple backtick
    out = out.replace(/```([a-zA-Z0-9_-]*)\r?\n([\s\S]*?)```/g, (match, lang, code) => {
      return `<pre><code>${code.trim()}</code></pre>`;
    });

    // Código inline con backtick simple
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');

    // Negrita
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

    return out;
  }

  function crearBurbujaDOM(clase, texto) {
    const div = document.createElement('div');
    div.className = `mensaje ${clase}`;

    if (clase === 'yo') {
      div.innerText = texto;
      div.addEventListener('click', () => {
        if (!estaGenerando) {
          input.value = div.innerText;
          input.focus();
          ajustarAlturaTextarea();
        }
      });
    } else {
      div.innerHTML = formatearMarkdownSimple(texto);
    }
    
    chat.appendChild(div);
    scrollAbajo();
    return div;
  }

  function agregarBurbujaSistema(aviso) {
    const sesionActual = sesiones.find(s => s.id === sesionActivaId);
    sesionActual.mensajes.push({ rol: 'ia', texto: aviso });
    crearBurbujaDOM('ia', aviso);
  }

  function scrollAbajo() {
    chatWrapper.scrollTop = chatWrapper.scrollHeight;
  }

  // =========================================================================
  // Interacción de Teclado y Envío
  // =========================================================================

  input.addEventListener('keydown', (e) => {
    if (slashPopup.classList.contains('visible')) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % filteredCommands.length;
        renderPopup();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + filteredCommands.length) % filteredCommands.length;
        renderPopup();
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        if (selectedIndex >= 0) {
          e.preventDefault();
          seleccionarComando(selectedIndex);
          return;
        }
      }
      if (e.key === 'Escape') {
        e.preventDefault();
        ocultarPopup();
        return;
      }
    }

    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarTexto(input.value);
    }
  });

  function enviarTexto(texto) {
    if (texto.trim() === '' || estaGenerando) return;
    
    const sesionActual = sesiones.find(s => s.id === sesionActivaId);
    sesionActual.mensajes.push({ rol: 'yo', texto: texto });
    crearBurbujaDOM('yo', texto);
    
    sesionActual.mensajes.push({ rol: 'ia', texto: '' });
    currentIaMessage = crearBurbujaDOM('ia', '');
    
    window.api.enviarMensaje(texto.trim());
    
    input.value = '';
    ajustarAlturaTextarea();
    estaGenerando = true;
    btnStop.style.display = 'block';
    ocultarPopup();
    
    // Auto-renombrar si es conversación nueva
    if (sesionActual.titulo.startsWith('Conversación') && sesionActual.mensajes.length <= 2) {
      sesionActual.titulo = texto.split(' ').slice(0, 3).join(' ') + '...';
      actualizarSidebar();
    }
  }

  // =========================================================================
  // Eventos de Streaming de la IA
  // =========================================================================

  window.api.onStream((chunk) => {
    if (currentIaMessage) {
      const sesionActual = sesiones.find(s => s.id === sesionActivaId);
      const ultimoMsg = sesionActual.mensajes[sesionActual.mensajes.length - 1];
      ultimoMsg.texto += chunk;
      
      currentIaMessage.innerHTML = formatearMarkdownSimple(ultimoMsg.texto);
      scrollAbajo();
    }
  });

  window.api.onFinStream(() => {
    estaGenerando = false;
    btnStop.style.display = 'none';
  });

  btnStop.addEventListener('click', () => {
    window.api.detenerGeneracion();
    estaGenerando = false;
    btnStop.style.display = 'none';
  });

  input.addEventListener('input', () => {
    ajustarAlturaTextarea();
    actualizarPopup();
  });

  input.addEventListener('blur', () => {
    setTimeout(() => ocultarPopup(), 150);
  });

  // Diálogo nativo y Drag & Drop
  btnArchivo.addEventListener('click', async () => {
    const ruta = await window.api.seleccionarArchivo();
    if (ruta) {
      input.value = `lee "${ruta}" `;
      input.focus();
      ajustarAlturaTextarea();
    }
  });

  window.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropOverlay.classList.add('drag-active');
  });

  window.addEventListener('dragleave', (e) => {
    if (e.clientX === 0 || e.clientY === 0) dropOverlay.classList.remove('drag-active');
  });

  window.addEventListener('drop', (e) => {
    e.preventDefault();
    dropOverlay.classList.remove('drag-active');
    const file = e.dataTransfer.files[0];
    if (file) {
      const ruta = (window.api && window.api.obtenerRutaArchivo) ? window.api.obtenerRutaArchivo(file) : file.path;
      if (ruta) {
        input.value = `lee "${ruta}" `;
        input.focus();
        ajustarAlturaTextarea();
      }
    }
  });

  // Inicialización
  actualizarSidebar();
  inicializarModelos();
  inicializarSkills();
</script>
</body>
</html>
