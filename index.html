<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 0; display: flex; height: 100vh;
      background: #000000; color: #ECECEC; overflow: hidden;
    }
    /* Zona arrastrable de Mac */
    .drag-region { position: absolute; top: 0; left: 0; right: 0; height: 38px; -webkit-app-region: drag; z-index: 10; }
    
    /* Layout principal */
    #sidebar {
      width: 260px; background: #0A0A0A; border-right: 1px solid #222;
      display: flex; flex-direction: column; padding-top: 40px;
      transition: transform 0.3s ease;
    }
    #sidebar.oculto { transform: translateX(-100%); position: absolute; height: 100%; z-index: 5; }
    
    .sesion-btn { padding: 12px 20px; color: #888; cursor: pointer; border-bottom: 1px solid #111; font-size: 14px; }
    .sesion-btn:hover { color: #fff; background: #151515; }
    
    #main-view { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    /* Botón superior izquierdo */
    #toggle-sidebar {
      position: absolute; top: 12px; left: 80px; z-index: 20; -webkit-app-region: no-drag;
      background: none; border: none; color: #888; cursor: pointer; font-size: 20px;
    }
    #toggle-sidebar:hover { color: #fff; }

    /* Chat y Mensajes */
    #chat { flex: 1; padding: 60px 40px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .mensaje { padding: 14px 18px; border-radius: 12px; max-width: 85%; line-height: 1.5; position: relative; font-size: 15px; }
    .yo { background: #1A1A1A; align-self: flex-end; cursor: pointer; border: 1px solid #333; transition: border 0.2s; }
    .yo:hover { border-color: #555; }
    .yo::after { content: '✎ Editar'; position: absolute; right: -60px; top: 15px; font-size: 11px; color: #666; opacity: 0; transition: opacity 0.2s; }
    .yo:hover::after { opacity: 1; }
    .ia { background: #000; align-self: flex-start; border-left: 2px solid #333; padding-left: 20px; }
    
    /* Controles inferiores */
    #input-container { padding: 20px 40px; background: #000; display: flex; gap: 10px; align-items: flex-end; }
    #btn-archivo {
      background: #1A1A1A; border: 1px solid #333; color: #fff; width: 45px; height: 45px;
      border-radius: 8px; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }
    #btn-archivo:hover { background: #2A2A2A; }
    
    .input-wrapper { flex: 1; position: relative; display: flex; }
    textarea {
      width: 100%; padding: 14px 50px 14px 14px; border-radius: 8px; border: 1px solid #333;
      background: #0A0A0A; color: white; outline: none; font-size: 15px; resize: none;
      min-height: 20px; max-height: 150px; overflow-y: auto; font-family: inherit;
    }
    textarea:focus { border-color: #555; }
    
    #btn-stop {
      position: absolute; right: 8px; bottom: 8px; background: #FF3B30; color: white;
      border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold;
      cursor: pointer; display: none;
    }
    
    /* Drag & Drop Overlay */
    #drop-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8);
      z-index: 100; display: none; align-items: center; justify-content: center;
      border: 2px dashed #0A84FF; margin: 20px; border-radius: 16px;
    }
    #drop-overlay.drag-active { display: flex; }
    #drop-overlay p { font-size: 24px; color: #0A84FF; font-weight: bold; }
  </style>
</head>
<body>
  <div class="drag-region"></div>
  
<!-- Panel de Sesiones -->
  <div id="sidebar">
    <div style="padding: 0 20px 15px; display: flex; justify-content: space-between; align-items: center;">
      <span style="color: #666; font-weight: bold; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;">Chats</span>
      <button id="btn-nueva-sesion" style="background: none; border: none; color: #0A84FF; cursor: pointer; font-size: 22px; padding: 0; line-height: 1;">+</button>
    </div>
    <div id="lista-sesiones">
      <!-- Aquí se inyectarán las sesiones con JS -->
    </div>
  </div>

  <!-- Vista Principal -->
  <div id="main-view">
    <button id="toggle-sidebar" style="-webkit-app-region: no-drag;">☰</button>
    <div id="drop-overlay"><p>Suelta el archivo aquí para leerlo</p></div>
    
    <div id="chat"></div>
    
    <div id="input-container">
      <button id="btn-archivo">+</button>
      <div class="input-wrapper">
        <textarea id="prompt" rows="1" placeholder="Comando o mensaje... (ej: lee <archivo|carpeta>, lee-repo, edita <archivo>)"></textarea>
        <button id="btn-stop">Detener ⏹</button>
      </div>
    </div>
  </div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('prompt');
  const btnStop = document.getElementById('btn-stop');
  const btnArchivo = document.getElementById('btn-archivo');
  const sidebar = document.getElementById('sidebar');
  const btnToggle = document.getElementById('toggle-sidebar');
  const dropOverlay = document.getElementById('drop-overlay');
  const listaSesiones = document.getElementById('lista-sesiones');
  const btnNuevaSesion = document.getElementById('btn-nueva-sesion');
  
  // ESTADO DE SESIONES
  let sesiones = [{ id: 1, titulo: 'Chat Principal', mensajes: [] }];
  let sesionActivaId = 1;
  let currentIaMessage = null;
  let estaGenerando = false;

  // Renderizar el menú lateral
  function actualizarSidebar() {
    listaSesiones.innerHTML = '';
    sesiones.forEach((sesion, index) => {
      const div = document.createElement('div');
      div.className = `sesion-btn ${sesion.id === sesionActivaId ? 'activa' : ''}`;
      div.innerText = sesion.titulo;
      div.onclick = () => cambiarSesion(sesion.id);
      listaSesiones.appendChild(div);
    });
  }

  // Cambiar de chat
  function cambiarSesion(id) {
    if (estaGenerando) return; // No cambiar si está escribiendo
    sesionActivaId = id;
    actualizarSidebar();
    
    // Recargar mensajes en pantalla
    chat.innerHTML = '';
    const sesionActual = sesiones.find(s => s.id === sesionActivaId);
    sesionActual.mensajes.forEach(msg => crearBurbujaDOM(msg.rol, msg.texto));
    chat.scrollTop = chat.scrollHeight;
  }

  // Nueva Sesión
  btnNuevaSesion.addEventListener('click', () => {
    if (estaGenerando) return;
    const nuevaId = Date.now();
    sesiones.unshift({ id: nuevaId, titulo: `Nuevo Chat ${sesiones.length + 1}`, mensajes: [] });
    cambiarSesion(nuevaId);
  });

  // Toggle Sidebar
  btnToggle.addEventListener('click', () => sidebar.classList.toggle('oculto'));

  // Solo crea la burbuja visual (no guarda en estado)
  function crearBurbujaDOM(clase, texto) {
    const div = document.createElement('div');
    div.className = `mensaje ${clase}`;
    div.innerText = texto;
    
    if (clase === 'yo') {
      div.addEventListener('click', () => {
        if (!estaGenerando) {
          input.value = div.innerText;
          input.focus();
        }
      });
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Enviar mensaje
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      enviarTexto(input.value);
    }
  });

  function enviarTexto(texto) {
    if (texto.trim() === '' || estaGenerando) return;
    
    const sesionActual = sesiones.find(s => s.id === sesionActivaId);
    
    // Guardar y mostrar mi mensaje
    sesionActual.mensajes.push({ rol: 'yo', texto: texto });
    crearBurbujaDOM('yo', texto);
    
    // Preparar placeholder para IA
    sesionActual.mensajes.push({ rol: 'ia', texto: '' });
    currentIaMessage = crearBurbujaDOM('ia', '');
    
    window.api.enviarMensaje(texto);
    
    input.value = '';
    input.style.height = 'auto';
    estaGenerando = true;
    btnStop.style.display = 'block';
    
    // Si el chat es nuevo, renombrarlo con las primeras palabras
    if (sesionActual.titulo.startsWith('Nuevo Chat') && sesionActual.mensajes.length <= 2) {
      sesionActual.titulo = texto.split(' ').slice(0, 3).join(' ') + '...';
      actualizarSidebar();
    }
  }

  // Eventos de API (Streaming)
  window.api.onStream((chunk) => {
    if (currentIaMessage) {
      currentIaMessage.innerText += chunk;
      chat.scrollTop = chat.scrollHeight;
      
      // Actualizar el estado en memoria
      const sesionActual = sesiones.find(s => s.id === sesionActivaId);
      sesionActual.mensajes[sesionActual.mensajes.length - 1].texto += chunk;
    }
  });

  window.api.onFinStream(() => {
    estaGenerando = false;
    btnStop.style.display = 'none';
  });

  btnStop.addEventListener('click', () => {
    window.api.detenerGeneracion();
    estaGenerando = false;
    btnStop.style.display = 'none';
  });

  // Archivos y Auto-resize
  input.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = (this.scrollHeight) + 'px';
  });

  btnArchivo.addEventListener('click', async () => {
    const ruta = await window.api.seleccionarArchivo();
    if (ruta) { input.value = `lee "${ruta}" `; input.focus(); }
  });

  window.addEventListener('dragover', (e) => { e.preventDefault(); dropOverlay.classList.add('drag-active'); });
  window.addEventListener('dragleave', (e) => { if (e.clientX === 0 || e.clientY === 0) dropOverlay.classList.remove('drag-active'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); dropOverlay.classList.remove('drag-active');
    const file = e.dataTransfer.files[0];
    if (file) {
      const ruta = (window.api && window.api.obtenerRutaArchivo) ? window.api.obtenerRutaArchivo(file) : file.path;
      if (ruta) {
        input.value = `lee "${ruta}" `;
        input.focus();
      }
    }
  });

  // Inicializar
  actualizarSidebar();
</script>
</body>
</html>
